  <text
     class="captionb"
     x="60"
     y="875"
     id="text40">Figure 1. AWSRT experimental architecture.</text>
  <text
     class="caption"
     x="476"
     y="875"
     id="text41">The External-field Surface defines structured wildfire-like fields. Observation</text>
  <text
     class="caption"
     x="60"
     y="903"
     id="text42">opportunity and support feed the Epistemic Surface, while adaptive actions and deployment geometry are selected by the Operational Surface.</text>
  <text
     class="caption"
     x="60"
     y="931"
     id="text43">Information impairment determines which attempted observations arrive. The Analysis Surface consumes field artifacts, belief traces, and policy/state traces.</text>
