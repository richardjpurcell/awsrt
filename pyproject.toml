[project]
name = "awsrt-backend"
version = "0.11.2"
description = "Adaptive Wildfire Sensing Research Tool (AWSRT) backend"
requires-python = ">=3.10,<3.13"
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.27,<1",
  "pydantic>=2.6,<3",
  "numpy>=1.24,<2",
  "zarr>=2.16,<3",
  "numcodecs>=0.10,<0.16",
  "pillow>=10.0",
  "matplotlib>=3.7,<4",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
  "httpx2>=2,<3",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["api*", "awsrt_core*"]
exclude = ["tests*"]

[tool.uvicorn]
factory = true

[tool.ruff]
line-length = 100
